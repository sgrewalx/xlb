name: Refresh Tech

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: refresh-tech
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-tech:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh tech manifest
        run: npm run automation:tech

      - name: Validate content
        run: npm run validate:content

      - name: Detect manifest changes
        id: changes
        run: |
          if git diff --quiet -- public/content/tech/top3.json public/content/tech/top.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit manifest update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add public/content/tech/top3.json public/content/tech/top.json
          git commit -m "chore: refresh tech manifest"

      - name: Push to main
        id: push
        if: steps.changes.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying after a short delay..."
            sleep 5
          done

          echo "Unable to push refreshed tech manifest after 3 attempts."
          exit 1

      - name: Dispatch validated release handoff
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XLB_RELEASE_SHA: ${{ steps.push.outputs.release_sha }}
          XLB_RELEASE_SOURCE: refresh-tech
        run: npm run automation:dispatch-release-handoff
