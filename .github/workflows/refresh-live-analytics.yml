name: Refresh Live Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-live-analytics-main
  cancel-in-progress: false

env:
  GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
  VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
  SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL }}
  XLB_GA4_LOOKBACK_DAYS: ${{ vars.XLB_GA4_LOOKBACK_DAYS }}
  XLB_SEARCH_CONSOLE_LAG_DAYS: ${{ vars.XLB_SEARCH_CONSOLE_LAG_DAYS }}
  XLB_SEARCH_CONSOLE_LOOKBACK_DAYS: ${{ vars.XLB_SEARCH_CONSOLE_LOOKBACK_DAYS }}

jobs:
  persist-analytics:
    runs-on: ubuntu-latest
    outputs:
      snapshot_date: ${{ steps.snapshot-date.outputs.value }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute snapshot date
        id: snapshot-date
        run: |
          SNAPSHOT_DATE="$(date -u +%F)"
          echo "XLB_SNAPSHOT_DATE=${SNAPSHOT_DATE}" >> "$GITHUB_ENV"
          echo "value=${SNAPSHOT_DATE}" >> "$GITHUB_OUTPUT"

      - name: Prepare Google service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            CREDENTIALS_FILE="${RUNNER_TEMP}/google-service-account.json"
            printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > "${CREDENTIALS_FILE}"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${CREDENTIALS_FILE}" >> "$GITHUB_ENV"
          fi

      - name: Capture GA4 snapshot
        run: |
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -n "${GA4_PROPERTY_ID:-}" ]; then
            npm run automation:fetch-ga4
          else
            npm run automation:import-ga4
          fi

      - name: Capture Search Console snapshot
        run: |
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -n "${SEARCH_CONSOLE_SITE_URL:-}" ]; then
            npm run automation:fetch-search-console
          else
            npm run automation:import-search-console
          fi

      - name: Merge analytics snapshots
        run: npm run automation:merge-analytics

      - name: Validate analytics snapshots
        run: npm run automation:validate-analytics

      - name: Upload private Search Console query evidence
        uses: actions/upload-artifact@v4
        with:
          name: search-console-queries-${{ env.XLB_SNAPSHOT_DATE }}
          path: automation/snapshots/search-console-queries-${{ env.XLB_SNAPSHOT_DATE }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Detect analytics changes
        id: analytics-changes
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- \
            "automation/snapshots/ga4-${XLB_SNAPSHOT_DATE}.json" \
            "automation/snapshots/search-console-${XLB_SNAPSHOT_DATE}.json" \
            "automation/snapshots/merged-${XLB_SNAPSHOT_DATE}.json")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.analytics-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit validated analytics snapshots
        if: steps.analytics-changes.outputs.changed == 'true'
        run: |
          git add -- \
            "automation/snapshots/ga4-${XLB_SNAPSHOT_DATE}.json" \
            "automation/snapshots/search-console-${XLB_SNAPSHOT_DATE}.json" \
            "automation/snapshots/merged-${XLB_SNAPSHOT_DATE}.json"
          git commit -m "chore: persist analytics snapshots for ${XLB_SNAPSHOT_DATE}"

      - name: Persist analytics to main
        if: steps.analytics-changes.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Analytics push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo "Unable to persist validated analytics after 3 attempts."
          exit 1

  publish-content-candidate:
    needs: persist-analytics
    runs-on: ubuntu-latest
    env:
      XLB_SNAPSHOT_DATE: ${{ needs.persist-analytics.outputs.snapshot_date }}

    steps:
      - name: Checkout last-known-good main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward through persisted analytics
        run: git pull --ff-only origin main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate content candidate
        run: npm run automation:content-candidate

      - name: Detect candidate changes
        id: candidate-changes
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- \
            public/content/live \
            public/content/topics \
            public/content/home \
            public/content/video/shorts.json \
            public/content/games \
            public/content/gallery \
            public/content/earthquakes/current.json \
            automation/reports \
            automation/experiments \
            public/sitemap.xml)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.candidate-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promote validated content candidate
        if: steps.candidate-changes.outputs.changed == 'true'
        run: |
          git add -- \
            public/content/live \
            public/content/topics \
            public/content/home \
            public/content/video/shorts.json \
            public/content/games \
            public/content/gallery \
            public/content/earthquakes/current.json \
            automation/reports \
            automation/experiments \
            public/sitemap.xml
          git commit -m "chore: promote validated content candidate"

      - name: Publish exact validated candidate to main
        id: candidate-push
        if: steps.candidate-changes.outputs.changed == 'true'
        run: |
          git push origin HEAD:main
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch validated release handoff
        if: steps.candidate-changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XLB_RELEASE_SHA: ${{ steps.candidate-push.outputs.release_sha }}
          XLB_RELEASE_SOURCE: refresh-live-analytics
        run: npm run automation:dispatch-release-handoff
