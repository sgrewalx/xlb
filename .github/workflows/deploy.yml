name: Deploy

on:
  workflow_dispatch:
    inputs:
      allow_review_required_deploy:
        description: "Explicitly approve a supervised deploy when readiness is review-required"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - automation/snapshots/**

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  SITE_BUCKET: xlb-codemachine-in-site
  CLOUDFRONT_DISTRIBUTION_ID: ESCMUKA0YFHMN
  VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
  XLB_DEPLOY_READINESS_MAX_AGE_HOURS: ${{ vars.XLB_DEPLOY_READINESS_MAX_AGE_HOURS }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record release commit
        run: echo "Deploying immutable candidate $(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce committed deploy readiness
        env:
          XLB_SUPERVISED_REVIEW_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_review_required_deploy || false }}
        run: npm run automation:enforce-deploy-readiness

      - name: Validate and build immutable release candidate
        run: npm run release:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload immutable assets
        run: |
          aws s3 sync dist/assets "s3://${SITE_BUCKET}/assets" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload content manifests
        run: |
          aws s3 sync dist/content "s3://${SITE_BUCKET}/content" \
            --delete \
            --cache-control "public,max-age=300,must-revalidate"

      - name: Upload root files
        run: |
          aws s3 sync dist "s3://${SITE_BUCKET}" \
            --delete \
            --exclude "assets/*" \
            --exclude "content/*" \
            --exclude "route-documents/*" \
            --exclude "route-documents.json" \
            --cache-control "public,max-age=60,must-revalidate"

      - name: Upload route documents as HTML
        run: |
          node -e "const fs = require('fs'); for (const item of JSON.parse(fs.readFileSync('dist/route-documents.json', 'utf8'))) console.log(item.documentPath + '\\t' + item.storageKey)" |
          while IFS=$'\t' read -r document key; do
            aws s3 cp "dist/${document}" "s3://${SITE_BUCKET}/${key}" \
              --cache-control "public,max-age=60,must-revalidate" \
              --content-type "text/html" \
              --metadata-directive REPLACE
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
