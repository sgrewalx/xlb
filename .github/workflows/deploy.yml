name: Deploy

on:
  repository_dispatch:
    types:
      - validated-release
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact validated main commit to release"
        required: true
        type: string
      allow_review_required_deploy:
        description: "Explicitly approve a supervised deploy when readiness is review-required"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  SITE_BUCKET: xlb-codemachine-in-site
  CLOUDFRONT_DISTRIBUTION_ID: ESCMUKA0YFHMN
  VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
  XLB_DEPLOY_READINESS_MAX_AGE_HOURS: ${{ vars.XLB_DEPLOY_READINESS_MAX_AGE_HOURS }}
  XLB_RELEASE_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_sha || inputs.release_sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release verifier
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify and checkout exact release SHA
        run: |
          git fetch --no-tags origin main
          npm run automation:verify-release-sha

      - name: Install dependencies
        run: npm ci

      - name: Resolve previously deployed exact SHA
        id: production-base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run automation:resolve-production-release

      - name: Classify exact release range
        id: classification
        env:
          XLB_DEPLOYED_BASE_SHA: ${{ steps.production-base.outputs.base_sha }}
        run: npm run automation:classify-release

      - name: Evaluate release handoff
        id: handoff
        env:
          XLB_SUPERVISED_REVIEW_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_review_required_deploy || false }}
          XLB_RELEASE_CLASSIFICATION: ${{ steps.classification.outputs.classification }}
        run: npm run automation:evaluate-release-handoff

      - name: Await supervised approval
        if: steps.handoff.outputs.disposition == 'awaiting-approval'
        run: echo "Release ${XLB_RELEASE_SHA} requires a supervised workflow_dispatch approval."

      - name: Report no-op release
        if: steps.handoff.outputs.disposition == 'no-op'
        run: echo "Release ${XLB_RELEASE_SHA} is already deployed; no production action is required."

      - name: Validate and build immutable release candidate
        if: steps.handoff.outputs.disposition == 'deploy'
        run: npm run release:build

      - name: Verify production analytics build
        if: steps.handoff.outputs.disposition == 'deploy'
        run: npm run verify:ga-build

      - name: Enforce committed deploy readiness
        if: steps.handoff.outputs.disposition == 'deploy'
        env:
          XLB_SUPERVISED_REVIEW_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_review_required_deploy || false }}
          XLB_RELEASE_CLASSIFICATION: ${{ steps.classification.outputs.classification }}
        run: npm run automation:enforce-deploy-readiness

      - name: Configure AWS credentials
        if: steps.handoff.outputs.disposition == 'deploy'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload immutable assets
        if: steps.handoff.outputs.disposition == 'deploy'
        run: |
          aws s3 sync dist/assets "s3://${SITE_BUCKET}/assets" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload content manifests
        if: steps.handoff.outputs.disposition == 'deploy'
        run: |
          aws s3 sync dist/content "s3://${SITE_BUCKET}/content" \
            --delete \
            --cache-control "public,max-age=300,must-revalidate"

      - name: Upload root files
        if: steps.handoff.outputs.disposition == 'deploy'
        run: |
          aws s3 sync dist "s3://${SITE_BUCKET}" \
            --delete \
            --exclude "assets/*" \
            --exclude "content/*" \
            --exclude "route-documents/*" \
            --exclude "route-documents.json" \
            --cache-control "public,max-age=60,must-revalidate"

      - name: Upload route documents as HTML
        if: steps.handoff.outputs.disposition == 'deploy'
        run: |
          node -e "const fs = require('fs'); for (const item of JSON.parse(fs.readFileSync('dist/route-documents.json', 'utf8'))) console.log(item.documentPath + '\\t' + item.storageKey)" |
          while IFS=$'\t' read -r document key; do
            aws s3 cp "dist/${document}" "s3://${SITE_BUCKET}/${key}" \
              --cache-control "public,max-age=60,must-revalidate" \
              --content-type "text/html" \
              --metadata-directive REPLACE
          done

      - name: Invalidate CloudFront
        if: steps.handoff.outputs.disposition == 'deploy'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Record deployed exact SHA
        if: steps.handoff.outputs.disposition == 'deploy'
        env:
          XLB_PRODUCTION_RELEASE_STATE_PATH: ${{ runner.temp }}/production-release-state/production-release.json
        run: npm run automation:write-production-release-state

      - name: Publish production release state
        if: steps.handoff.outputs.disposition == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ env.XLB_RELEASE_SHA }}
          path: ${{ runner.temp }}/production-release-state/production-release.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize deployed release
        if: steps.handoff.outputs.disposition == 'deploy'
        run: |
          {
            echo "## Final release outcome"
            echo
            echo "**DEPLOYED**"
            echo
            echo "- Base SHA: ${{ steps.classification.outputs.base_sha }}"
            echo "- Release SHA: ${XLB_RELEASE_SHA}"
            echo "- Classification: ${{ steps.classification.outputs.classification }}"
            echo "- Changed paths: ${{ steps.classification.outputs.changed_file_count }}"
          } >> "$GITHUB_STEP_SUMMARY"
