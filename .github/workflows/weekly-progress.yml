name: Generate Weekly Progress

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-progress-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Measure active experiments from committed analytics
        run: npm run automation:measure-experiments

      - name: Generate weekly JSON and Markdown
        run: npm run automation:weekly-progress

      - name: Validate control-plane records
        run: node --test automation/experiments/*.test.mjs automation/progress/weekly/*.test.mjs

      - name: Commit internal progress records
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- automation/experiments/queue.json automation/experiments/history automation/progress/weekly)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- automation/experiments/queue.json automation/experiments/history automation/progress/weekly
          git commit -m "chore: record weekly experiment progress"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
